name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Write project files
        run: |
          mkdir -p app/src/main/java/com/eni/poolassist
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/res/xml

          cat > settings.gradle << 'ENI_EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "PoolAssist"
          include ':app'
          ENI_EOF

          cat > build.gradle << 'ENI_EOF'
          plugins {
              id 'com.android.application' version '8.5.1' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.24' apply false
          }
          ENI_EOF

          cat > gradle.properties << 'ENI_EOF'
          org.gradle.jvmargs=-Xmx2048m
          android.useAndroidX=true
          kotlin.code.style=official
          ENI_EOF

          cat > app/build.gradle << 'ENI_EOF'
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }
          android {
              namespace 'com.eni.poolassist'
              compileSdk 34
              defaultConfig {
                  applicationId "com.eni.poolassist"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }
              buildTypes {
                  release { minifyEnabled false }
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = '17' }
          }
          dependencies {
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'androidx.core:core-ktx:1.12.0'
          }
          ENI_EOF

          cat > app/src/main/AndroidManifest.xml << 'ENI_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>

              <application
                  android:label="@string/app_name"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
                  <service
                      android:name=".OverlayService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection"/>
                  <service
                      android:name=".PoolAccessibilityService"
                      android:exported="true"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService"/>
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config"/>
                  </service>
              </application>
          </manifest>
          ENI_EOF

          cat > app/src/main/res/xml/accessibility_service_config.xml << 'ENI_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeWindowStateChanged"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:canRetrieveWindowContent="true"
              android:description="@string/acc_desc"
              android:notificationTimeout="100" />
          ENI_EOF

          cat > app/src/main/res/values/strings.xml << 'ENI_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">PoolAssist</string>
              <string name="acc_desc">رسم خطوط التصويب فوق اللعبة بأمان</string>
          </resources>
          ENI_EOF

          cat > app/src/main/java/com/eni/poolassist/MainActivity.kt << 'ENI_EOF'
          package com.eni.poolassist

          import android.content.Intent
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.drawable.GradientDrawable
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.LinearLayout
          import android.widget.TextView
          import android.widget.Toast
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.content.ContextCompat

          class MainActivity : AppCompatActivity() {
              private val REQ_PROJ = 1001
              private lateinit var status: TextView

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(20), dp(48), dp(20), dp(24))
                      background = GradientDrawable(
                          GradientDrawable.Orientation.TL_BR,
                          intArrayOf(Color.parseColor("#141225"), Color.parseColor("#241E3A"))
                      )
                  }

                  root.addView(TextView(this).apply {
                      text = "PoolAssist"
                      textSize = 30f
                      setTextColor(Color.parseColor("#EDEAF7"))
                      setTypeface(null, Typeface.BOLD)
                  })

                  root.addView(TextView(this).apply {
                      text = "خطوط تصويب ذكية — كل كرة بلونها"
                      textSize = 14f
                      setTextColor(Color.parseColor("#9C93BD"))
                      setPadding(0, dp(6), 0, dp(18))
                  })

                  status = TextView(this).apply {
                      text = "جاهز — اتبع الخطوات"
                      textSize = 13f
                      setTextColor(Color.parseColor("#B9B0D8"))
                      setPadding(0, 0, 0, dp(14))
                  }
                  root.addView(status)

                  root.addView(card("① صلاحية الشاشة العائمة", "السماح بالرسم فوق التطبيقات") {
                      startActivity(
                          Intent(
                              Settings.ACTION_MANAGE_OVERLAY_PERMISSION,
                              Uri.parse("package:$packageName")
                          )
                      )
                  })

                  root.addView(card("② تفعيل خدمة الرسم", "تفعيل PoolAssist من إعدادات إمكانية الوصول") {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  })

                  root.addView(card("③ تشغيل الخطوط", "التقاط الشاشة ثم فتح اللعبة") {
                      val mgr = getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                      startActivityForResult(mgr.createScreenCaptureIntent(), REQ_PROJ)
                  })

                  root.addView(card("④ افتح 8 Ball Pool", "ستظهر الخطوط على الطاولة") {
                      val i = packageManager.getLaunchIntentForPackage("com.miniclip.eightballpool")
                      if (i != null) {
                          startActivity(i)
                      } else {
                          try {
                              startActivity(Intent(Intent.ACTION_VIEW, Uri.parse("market://details?id=com.miniclip.eightballpool")))
                              Toast.makeText(this, "يبدو أن اللعبة غير متثبتة، فتحنا لك المتجر", Toast.LENGTH_LONG).show()
                          } catch (e: Exception) {
                              Toast.makeText(this, "تأكد من تثبيت اللعبة أولاً", Toast.LENGTH_LONG).show()
                          }
                      }
                  })

                  setContentView(root)
              }

              private fun card(title: String, sub: String, onClick: () -> Unit): LinearLayout {
                  val card = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(dp(18), dp(14), dp(18), dp(14))
                      background = GradientDrawable().apply {
                          setColor(Color.parseColor("#2A2444"))
                          cornerRadius = dp(18).toFloat()
                      }
                      isClickable = true
                      isFocusable = true
                      setOnClickListener { onClick() }
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT
                      ).apply { bottomMargin = dp(10) }
                  }
                  card.addView(TextView(this).apply {
                      text = title
                      textSize = 16f
                      setTextColor(Color.parseColor("#EDEAF7"))
                      setTypeface(null, Typeface.BOLD)
                  })
                  card.addView(TextView(this).apply {
                      text = sub
                      textSize = 12f
                      setTextColor(Color.parseColor("#9C93BD"))
                      setPadding(0, dp(4), 0, 0)
                  })
                  return card
              }

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  @Suppress("DEPRECATION")
                  super.onActivityResult(requestCode, resultCode, data)
                  if (requestCode == REQ_PROJ) {
                      if (resultCode == RESULT_OK && data != null) {
                          val svc = Intent(this, OverlayService::class.java).apply {
                              putExtra("resultCode", resultCode)
                              putExtra("data", data)
                          }
                          ContextCompat.startForegroundService(this, svc)
                          status.text = "الخطوط تعمل — اذهب للعبة"
                          status.setTextColor(Color.parseColor("#7CFFB2"))
                      } else {
                          status.text = "تم إلغاء التقاط الشاشة"
                          status.setTextColor(Color.parseColor("#FF8B8B"))
                      }
                  }
              }
          }
          ENI_EOF

          cat > app/src/main/java/com/eni/poolassist/Physics.kt << 'ENI_EOF'
          package com.eni.poolassist

          import kotlin.math.abs
          import kotlin.math.atan2
          import kotlin.math.cos
          import kotlin.math.hypot
          import kotlin.math.min
          import kotlin.math.sin
          import kotlin.math.sqrt

          object Physics {
              fun rayCircle(cx: Float, cy: Float, dx: Float, dy: Float, bx: Float, by: Float, r: Float): Float? {
                  val ox = bx - cx; val oy = by - cy
                  val b = ox * dx + oy * dy
                  val c = ox * ox + oy * oy - r * r
                  val disc = b * b - c
                  if (disc < 0f) return null
                  val t = -b - sqrt(disc)
                  return if (t > 0.001f) t else null
              }

              fun predictPath(cue: Ball, angle: Float, balls: List<Ball>, w: Float, h: Float, r: Float, maxBounce: Int = 3): List<Pair<Float, Float>> {
                  var x = cue.x; var y = cue.y
                  var dx = cos(angle); var dy = sin(angle)
                  val pts = mutableListOf(x to y)
                  for (i in 0 until maxBounce) {
                      var bestT = Float.MAX_VALUE; var hitBall = false
                      val tw = when { dx > 0f -> (w - r - x) / dx; dx < 0f -> (r - x) / dx; else -> Float.MAX_VALUE }
                      val th = when { dy > 0f -> (h - r - y) / dy; dy < 0f -> (r - y) / dy; else -> Float.MAX_VALUE }
                      for (b in balls) {
                          if (b.isCue) continue
                          val t = rayCircle(x, y, dx, dy, b.x, b.y, r * 2f)
                          if (t != null && t < bestT) { bestT = t; hitBall = true }
                      }
                      if (!hitBall) bestT = min(tw, th)
                      if (bestT == Float.MAX_VALUE || bestT <= 0f) break
                      x += dx * bestT; y += dy * bestT
                      pts.add(x to y)
                      if (hitBall) return pts
                      if (tw < th) dx = -dx else dy = -dy
                  }
                  return pts
              }

              fun ghostAngle(cue: Ball, target: Ball, px: Float, py: Float, r: Float): Float? {
                  val ux = px - target.x; val uy = py - target.y
                  val len = hypot(ux, uy)
                  if (len < 1f) return null
                  val gx = target.x - ux / len * r * 2f
                  val gy = target.y - uy / len * r * 2f
                  if (abs(gx - cue.x) < 0.01f && abs(gy - cue.y) < 0.01f) return null
                  return atan2(gy - cue.y, gx - cue.x)
              }
          }
          ENI_EOF

          cat > app/src/main/java/com/eni/poolassist/Detector.kt << 'ENI_EOF'
          package com.eni.poolassist

          import android.graphics.Bitmap
          import android.graphics.Color
          import kotlin.math.abs
          import kotlin.math.hypot

          data class Ball(val x: Float, val y: Float, val color: Int, val isCue: Boolean)
          data class Segment(val color: Int, val points: List<Pair<Float, Float>>, val dot: Pair<Float, Float>? = null)

          object Detector {
              private var buf: IntArray? = null

              fun detect(bmp: Bitmap, scaleFactor: Float): List<Ball> {
                  val w = bmp.width; val h = bmp.height
                  val need = w * h
                  if (need <= 0) return emptyList()
                  val px = if (buf == null || buf!!.size != need) IntArray(need).also { buf = it } else buf!!
                  bmp.getPixels(px, 0, w, 0, 0, w, h)
                  val bg = dominant(px, w, h)
                  
                  val topSafe = (h * 0.15).toInt()
                  val bottomSafe = (h * 0.85).toInt()
                  val leftSafe = (w * 0.10).toInt()
                  val rightSafe = (w * 0.90).toInt()

                  val out = mutableListOf<Ball>()
                  val step = 4
                  val r = 12
                  
                  var y = topSafe
                  while (y < bottomSafe) {
                      var x = leftSafe
                      while (x < rightSafe) {
                          val c = px[y * w + x]
                          if (dist2(c, bg) < 40 * 40) { x += step; continue }
                          
                          val rr = (c shr 16) and 0xFF; val gg = (c shr 8) and 0xFF; val bb = c and 0xFF
                          val mx = maxOf(rr, gg, bb); val mn = minOf(rr, gg, bb); val sat = mx - mn
                          
                          val cls: Int? = when {
                              mx > 200 && sat < 30 -> Color.WHITE
                              mx < 50 && sat < 40 -> Color.parseColor("#222222")
                              mx > 100 && sat > 70 -> classify(rr, gg, bb)
                              else -> null
                          }
                          
                          if (cls != null && isBlob(px, w, h, x, y, c, r)) {
                              out.add(Ball(x * scaleFactor, y * scaleFactor, cls, cls == Color.WHITE))
                          }
                          x += step
                      }
                      y += step
                  }
                  
                  val merged = mutableListOf<Ball>()
                  for (b in out) {
                      val near = merged.any {
                          abs(it.x - b.x) < 60f && abs(it.y - b.y) < 60f && it.isCue == b.isCue && dist2(it.color, b.color) < 80 * 80
                      }
                      if (!near) merged.add(b)
                  }
                  return merged
              }

              fun buildSegments(balls: List<Ball>, screenW: Float, screenH: Float, ballR: Float = 16f): List<Segment> {
                  val cue = balls.firstOrNull { it.isCue } ?: return emptyList()
                  val targets = balls.filter { !it.isCue }
                  if (targets.isEmpty()) return emptyList()
                  
                  val pockets = listOf(30f to 30f, (screenW - 30f) to 30f, 30f to (screenH - 30f), (screenW - 30f) to (screenH - 30f))
                  val segs = mutableListOf<Segment>()
                  
                  for (target in targets) {
                      var bestPocket: Pair<Float, Float>? = null; var bestD = Float.MAX_VALUE
                      for (p in pockets) {
                          val d = hypot(p.first - target.x, p.second - target.y)
                          if (d < bestD) { bestD = d; bestPocket = p }
                      }
                      val pocket = bestPocket ?: continue
                      val ang = Physics.ghostAngle(cue, target, pocket.first, pocket.second, ballR) ?: continue
                      
                      val path = Physics.predictPath(cue, ang, balls, screenW, screenH, ballR, maxBounce = 3)
                      if (path.size < 2) continue
                      
                      segs.add(Segment(Color.WHITE, path, null))
                      segs.add(Segment(target.color, listOf(target.x to target.y, pocket.first to pocket.second), pocket))
                  }
                  return segs
              }

              private fun dominant(px: IntArray, w: Int, h: Int): Int {
                  val map = HashMap<Int, Int>()
                  var y = 0
                  while (y < h) {
                      var x = 0
                      while (x < w) {
                          val c = px[y * w + x]
                          val q = (((c shr 19) and 0x1F) shl 10) or (((c shr 11) and 0x1F) shl 5) or ((c shr 3) and 0x1F)
                          map[q] = (map[q] ?: 0) + 1
                          x += 8
                      }
                      y += 8
                  }
                  val best = map.maxByOrNull { it.value }?.key ?: 0
                  val r = ((best shr 10) and 0x1F) shl 3
                  val g = ((best shr 5) and 0x1F) shl 3
                  val b = (best and 0x1F) shl 3
                  return Color.rgb(r, g, b)
              }

              private fun isBlob(px: IntArray, w: Int, h: Int, x: Int, y: Int, c: Int, r: Int): Boolean {
                  var count = 0
                  val xs = intArrayOf(x - r, x + r, x, x)
                  val ys = intArrayOf(y, y, y - r, y + r)
                  for (i in 0 until 4) {
                      val nx = xs[i]; val ny = ys[i]
                      if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue
                      if (dist2(px[ny * w + nx], c) < 80 * 80) count++
                  }
                  return count >= 3
              }

              private fun classify(r: Int, g: Int, b: Int): Int {
                  val palette = intArrayOf(
                      Color.rgb(220, 20, 20), Color.rgb(240, 220, 40), Color.rgb(30, 80, 220),
                      Color.rgb(250, 130, 0), Color.rgb(30, 160, 30), Color.rgb(120, 30, 160),
                      Color.rgb(120, 30, 30), Color.rgb(0, 180, 180)
                  )
                  var best = Color.WHITE; var bestD = Int.MAX_VALUE
                  for (p in palette) {
                      val pr = (p shr 16) and 0xFF; val pg = (p shr 8) and 0xFF; val pb = p and 0xFF
                      val d = (r - pr) * (r - pr) + (g - pg) * (g - pg) + (b - pb) * (b - pb)
                      if (d < bestD) { bestD = d; best = p }
                  }
                  return best
              }

              private fun dist2(c1: Int, c2: Int): Int {
                  val r1 = (c1 shr 16) and 0xFF; val g1 = (c1 shr 8) and 0xFF; val b1 = c1 and 0xFF
                  val r2 = (c2 shr 16) and 0xFF; val g2 = (c2 shr 8) and 0xFF; val b2 = c2 and 0xFF
                  return (r1 - r2) * (r1 - r2) + (g1 - g2) * (g1 - g2) + (b1 - b2) * (b1 - b2)
              }
          }
          ENI_EOF

          cat > app/src/main/java/com/eni/poolassist/OverlayView.kt << 'ENI_EOF'
          package com.eni.poolassist

          import android.content.Context
          import android.graphics.Canvas
          import android.graphics.Paint
          import android.view.View

          class OverlayView(ctx: Context) : View(ctx) {
              private var segments: List<Segment> = emptyList()
              private var lineWidth: Float = 4f
              private val linePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { 
                  style = Paint.Style.STROKE; 
                  strokeCap = Paint.Cap.ROUND; 
                  strokeJoin = Paint.Join.ROUND 
                  alpha = 180
              }
              private val dotPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { style = Paint.Style.FILL }

              fun updateSegments(list: List<Segment>, width: Float) {
                  segments = list
                  lineWidth = width
                  postInvalidate()
              }

              fun clear() {
                  segments = emptyList()
                  postInvalidate()
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  if (segments.isEmpty()) return
                  linePaint.strokeWidth = lineWidth
                  for (seg in segments) {
                      linePaint.color = seg.color
                      val pts = seg.points
                      for (i in 0 until pts.size - 1) {
                          canvas.drawLine(pts[i].first, pts[i].second, pts[i + 1].first, pts[i + 1].second, linePaint)
                      }
                      seg.dot?.let { dotPaint.color = seg.color; canvas.drawCircle(it.first, it.second, lineWidth + 2f, dotPaint) }
                  }
              }
          }
          ENI_EOF

          cat > app/src/main/java/com/eni/poolassist/PoolAccessibilityService.kt << 'ENI_EOF'
          package com.eni.poolassist

          import android.accessibilityservice.AccessibilityService
          import android.graphics.Color
          import android.graphics.PixelFormat
          import android.graphics.drawable.GradientDrawable
          import android.view.Gravity
          import android.view.MotionEvent
          import android.view.View
          import android.view.WindowManager
          import android.widget.TextView
          import android.view.accessibility.AccessibilityEvent

          class PoolAccessibilityService : AccessibilityService() {

              companion object {
                  var instance: PoolAccessibilityService? = null
              }

              private lateinit var win: WindowManager
              private lateinit var overlay: OverlayView
              private var showLines = true
              private var lineScale = 1f

              private lateinit var controlView: TextView
              private lateinit var controlParams: WindowManager.LayoutParams

              override fun onServiceConnected() {
                  super.onServiceConnected()
                  instance = this
                  win = getSystemService(WINDOW_SERVICE) as WindowManager
                  overlay = OverlayView(this)
                  val params = WindowManager.LayoutParams(
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.MATCH_PARENT,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or
                      WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE or
                      WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL or
                      WindowManager.LayoutParams.FLAG_LAYOUT_IN_SCREEN,
                      PixelFormat.TRANSLUCENT
                  )
                  try {
                      win.addView(overlay, params)
                  } catch (e: Exception) {}

                  controlView = TextView(this).apply {
                      text = "P"
                      textSize = 18f
                      gravity = Gravity.CENTER
                      setTextColor(Color.parseColor("#EDEAF7"))
                      background = GradientDrawable().apply {
                          shape = GradientDrawable.OVAL
                          setColor(Color.parseColor("#7C5CFF"))
                      }
                  }
                  val size = dp(48)
                  controlParams = WindowManager.LayoutParams(
                      size, size,
                      WindowManager.LayoutParams.TYPE_ACCESSIBILITY_OVERLAY,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                      PixelFormat.TRANSLUCENT
                  ).apply {
                      gravity = Gravity.TOP or Gravity.START
                      x = dp(14)
                      y = dp(110)
                  }

                  controlView.setOnTouchListener(object : View.OnTouchListener {
                      private var initialX = 0
                      private var initialY = 0
                      private var initialTouchX = 0f
                      private var initialTouchY = 0f
                      private var moved = false

                      override fun onTouch(v: View, event: MotionEvent): Boolean {
                          when (event.action) {
                              MotionEvent.ACTION_DOWN -> {
                                  initialX = controlParams.x
                                  initialY = controlParams.y
                                  initialTouchX = event.rawX
                                  initialTouchY = event.rawY
                                  moved = false
                                  return true
                              }
                              MotionEvent.ACTION_MOVE -> {
                                  val dx = event.rawX - initialTouchX
                                  val dy = event.rawY - initialTouchY
                                  if (Math.abs(dx) > dp(8) || Math.abs(dy) > dp(8)) moved = true
                                  controlParams.x = initialX + dx.toInt()
                                  controlParams.y = initialY + dy.toInt()
                                  win.updateViewLayout(controlView, controlParams)
                                  return true
                              }
                              MotionEvent.ACTION_UP -> {
                                  if (!moved) {
                                      showLines = !showLines
                                      if (!showLines) overlay.clear() else overlay.postInvalidate()
                                  }
                                  return true
                              }
                          }
                          return false
                      }
                  })

                  try {
                      win.addView(controlView, controlParams)
                  } catch (e: Exception) {}
              }

              fun updateLines(segs: List<Segment>) {
                  if (showLines) overlay.updateSegments(segs, 4f + lineScale * 3f)
                  else overlay.clear()
              }

              private fun dp(v: Int): Int = (v * resources.displayMetrics.density).toInt()

              override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
              override fun onInterrupt() {}

              override fun onDestroy() {
                  instance = null
                  try { win.removeView(overlay) } catch (e: Exception) {}
                  try { win.removeView(controlView) } catch (e: Exception) {}
                  super.onDestroy()
              }
          }
          ENI_EOF

          cat > app/src/main/java/com/eni/poolassist/OverlayService.kt << 'ENI_EOF'
          package com.eni.poolassist

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.PendingIntent
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.Bitmap
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Handler
          import android.os.HandlerThread
          import android.os.IBinder
          import android.os.Looper
          import android.view.WindowManager

          class OverlayService : Service() {
              private var projection: MediaProjection? = null
              private var reader: ImageReader? = null
              private var virtual: VirtualDisplay? = null
              private val main = Handler(Looper.getMainLooper())
              private val bgThread = HandlerThread("eni-capture").apply { start() }
              private val bg = Handler(bgThread.looper)
              private var running = true
              private var scaleFactor = 2f
              private var paddedBmp: Bitmap? = null
              private var croppedBmp: Bitmap? = null

              private val loop = object : Runnable {
                  override fun run() {
                      if (!running) return
                      try { grab() } catch (_: Exception) {}
                      bg.postDelayed(this, 150)
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  if (intent?.action == "STOP") {
                      stopSelf()
                      return START_NOT_STICKY
                  }

                  val notif = buildNotif()
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(7, notif, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  } else {
                      startForeground(7, notif)
                  }

                  val code = intent?.getIntExtra("resultCode", 0) ?: 0
                  @Suppress("DEPRECATION")
                  val data: Intent? = intent?.getParcelableExtra("data")
                  if (code == 0 || data == null) return START_STICKY

                  val mgr = getSystemService(MEDIA_PROJECTION_SERVICE) as MediaProjectionManager
                  projection = mgr.getMediaProjection(code, data)
                  projection?.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() { main.post { stopSelf() } }
                  }, bg)

                  val win = getSystemService(WINDOW_SERVICE) as WindowManager
                  val (sw, sh) = if (Build.VERSION.SDK_INT >= 30) {
                      val b = win.maximumWindowMetrics.bounds
                      b.width() to b.height()
                  } else {
                      @Suppress("DEPRECATION")
                      resources.displayMetrics.widthPixels to resources.displayMetrics.heightPixels
                  }

                  val capW = (sw / 2).coerceAtLeast(2)
                  val capH = (sh / 2).coerceAtLeast(2)
                  scaleFactor = sw.toFloat() / capW.toFloat()

                  reader = ImageReader.newInstance(capW, capH, PixelFormat.RGBA_8888, 2)
                  val density = resources.displayMetrics.densityDpi
                  virtual = projection?.createVirtualDisplay("eni", capW, capH, density, DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, reader!!.surface, null, bg)

                  running = true
                  bg.removeCallbacks(loop)
                  bg.postDelayed(loop, 600)
                  return START_STICKY
              }

              private fun grab() {
                  val r = reader ?: return
                  val img = r.acquireLatestImage() ?: return
                  try {
                      val plane = img.planes[0]
                      val rowStride = plane.rowStride; val pixelStride = plane.pixelStride
                      val padding = rowStride - pixelStride * img.width
                      val paddedW = img.width + padding / pixelStride
                      val buf = plane.buffer
                      buf.rewind()
                      var padded = paddedBmp
                      if (padded == null || padded.width != paddedW || padded.height != img.height) {
                          padded?.recycle()
                          padded = Bitmap.createBitmap(paddedW, img.height, Bitmap.Config.ARGB_8888)
                          paddedBmp = padded
                      }
                      padded.copyPixelsFromBuffer(buf)
                      var cropped = croppedBmp
                      if (cropped == null || cropped.width != img.width || cropped.height != img.height) {
                          cropped?.recycle()
                          cropped = Bitmap.createBitmap(img.width, img.height, Bitmap.Config.ARGB_8888)
                          croppedBmp = cropped
                      }
                      val canvas = android.graphics.Canvas(cropped)
                      canvas.drawBitmap(padded, 0f, 0f, null)

                      val win = getSystemService(WINDOW_SERVICE) as WindowManager
                      val (sw, sh) = if (Build.VERSION.SDK_INT >= 30) {
                          val b = win.maximumWindowMetrics.bounds
                          b.width() to b.height()
                      } else {
                          @Suppress("DEPRECATION")
                          resources.displayMetrics.widthPixels to resources.displayMetrics.heightPixels
                      }

                      val balls = Detector.detect(cropped, scaleFactor)
                      val segs = Detector.buildSegments(balls, sw.toFloat(), sh.toFloat(), ballR = 16f)
                      main.post { PoolAccessibilityService.instance?.updateLines(segs) }
                  } catch (_: Exception) {
                  } finally {
                      img.close()
                  }
              }

              private fun buildNotif(): Notification {
                  val ch = NotificationChannel("eni", "PoolAssist", NotificationManager.IMPORTANCE_LOW)
                  (getSystemService(NOTIFICATION_SERVICE) as NotificationManager).createNotificationChannel(ch)
                  val stopIntent = PendingIntent.getService(this, 0, Intent(this, OverlayService::class.java).apply { action = "STOP" }, PendingIntent.FLAG_IMMUTABLE)
                  return Notification.Builder(this, "eni")
                      .setContentTitle("PoolAssist يعمل")
                      .setSmallIcon(android.R.drawable.ic_menu_compass)
                      .setOngoing(true)
                      .addAction(android.R.drawable.ic_media_pause, "إيقاف", stopIntent)
                      .build()
              }

              override fun onDestroy() {
                  running = false
                  bg.removeCallbacks(loop)
                  virtual?.release(); virtual = null
                  projection?.stop(); projection = null
                  reader?.close(); reader = null
                  paddedBmp?.recycle(); paddedBmp = null
                  croppedBmp?.recycle(); croppedBmp = null
                  bgThread.quitSafely()
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          ENI_EOF

          echo "كل الملفات كتبت بنجاح"

      - name: Build APK
        run: |
          gradle wrapper --gradle-version 8.7
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PoolAssist-APK
          path: app/build/outputs/apk/debug/app-debug.apk
